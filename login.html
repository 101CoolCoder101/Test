<html><head>
<title>Web user login</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<link href="/skin/custom/login/index.css" rel="stylesheet" type="text/css">
<style type="text/css">
body
{
    font-family:Arial, Helvetica, sans-serif;
}
</style>
<script language=javascript src="/customdir/custom.js"></script>
<script language=javascript>
function onBodyLoad()
{

    document.forms[0].user_name.focus();
}


function trim( str )
{
    str = str.replace(/^\s*/, "");
    str = str.replace(/\s*$/, "");
    return str;
}


function mySubmit(oForm)
{
    var sUserName = trim(oForm.user_name.value);


    oForm.user_name.value = sUserName;


    if ( sUserName=="" )
    {
        alert("Please input user name.");
        oForm.user_name.focus();
        return false;
    }


    try{
        // save the language to cookie, and no expiress 
        document.cookie = "lang=" + oForm.lang.value + ";path=/";
    }
    catch(e)
    {
        // cookie not be opened
    }
    document.getElementById("login").disabled = true;
    return true;
}
</script>
</head>
<body onload="onBodyLoad()">
<form action="/Web/login" method=post onsubmit="return mySubmit(this);">
<div class="da_width">
  <div class="dl_back" id="dl_margin">
    <div style="float:left;width:370px;margin-top:83px;" align="right">


</div>


<div class="dl_right1"><div class="dl_headline_en"></div>

<table class="table1" cellpadding="1" cellspacing="1" width="228px">
<tr>
<td width="30%">User Name</td>
<td width="70%"><input type="text" name="user_name" class="dl_text" maxlength="55"/>
</td>
</tr>
<tr>
<td>Password</td>
<td><input type="password" name="password" class="dl_text" maxlength="88"/></td>
</tr>


<script>
    var nLanguageSupported = WnmGetLanguageSupported ();
    if (0 != (2 & nLanguageSupported))
        document.write("<tr>");
    else
        document.write("<tr style='display:none'>");
</script>
<td>Language</td>
<td>
  <select name="lang" id="lang">
      <option value=0>English
      <option value=1>中文
  </select>
</td>
</tr>
<tr>
<td colspan="2" align="center" class="button"><input type="submit" value="Login"  class="an" id="login"/></td>
</tr>
</table>
</div>
</div>
</div>


</form>
</body>
</html>
