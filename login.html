<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #4c6ef5, #7950f2);
        font-family: Arial, sans-serif;
    }

    .login-box {
        background: white;
        padding: 40px;
        width: 320px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
    }

    input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 15px;
    }

    button {
        width: 100%;
        padding: 12px;
        background: #4c6ef5;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background: #3b5bdb;
    }

    #message {
        margin-top: 15px;
        text-align: center;
        font-weight: bold;
        color: red;
    }
</style>
</head>

<body>

<div class="login-box">
    <h2>Login</h2>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <div id="message"></div>
</div>

<script>
function login() {
    const user = document.getElementById("username").value;
    const pw = document.getElementById("password").value;

    if (user === "admin" && pw === "password") {
        document.getElementById("message").style.color = "green";
        document.getElementById("message").innerText = "authentication successful";
    } else {
        document.getElementById("message").style.color = "red";
        document.getElementById("message").innerText = "authentication failed";
    }
}
</script>

</body>
</html>
