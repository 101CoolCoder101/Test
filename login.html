<!DOCTYPE html>
<html>
<head>
<title>Web User Login</title>
<meta charset="UTF-8">

<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f0f2f5;
        margin: 0;
        padding: 0;
    }

    .container {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .login-box {
        background: white;
        padding: 35px 45px;
        border-radius: 10px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        width: 350px;
    }

    .login-box h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
    }

    table {
        width: 100%;
    }

    td {
        padding: 8px 0;
        font-size: 14px;
    }

    input[type="text"],
    input[type="password"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
    }

    .btn {
        width: 100%;
        padding: 12px;
        background: #4c6ef5;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        cursor: pointer;
        margin-top: 10px;
    }

    .btn:hover {
        background: #3b5bdb;
    }

    #message {
        margin-top: 15px;
        text-align: center;
        font-weight: bold;
        color: red;
    }
</style>

<script>
function trim(str) {
    return str.replace(/^\s+|\s+$/g, "");
}

function mySubmit(form) {
    let user = trim(form.user_name.value);
    let pw   = trim(form.password.value);

    form.user_name.value = user;

    if (user === "" || pw === "") {
        alert("Please input user name and password.");
        return false;
    }

    if (user === "admin" && pw === "password") {
        document.getElementById("message").style.color = "green";
        document.getElementById("message").innerText = "authentication successful";
    } else {
        document.getElementById("message").style.color = "red";
        document.getElementById("message").innerText = "authentication failed";
    }

    return false; // prevent actual form submit
}
</script>

</head>

<body onload="document.forms[0].user_name.focus();">

<div class="container">
    <div class="login-box">
        <h2>Web User Login</h2>

        <form onsubmit="return mySubmit(this);">
            <table>
                <tr>
                    <td>User Name</td>
                    <td><input type="text" name="user_name" maxlength="55"></td>
                </tr>

                <tr>
                    <td>Password</td>
                    <td><input type="password" name="password" maxlength="88"></td>
                </tr>

                <tr>
                    <td colspan="2">
                        <input type="submit" value="Login" class="btn">
                    </td>
                </tr>
            </table>
        </form>

        <div id="message"></div>
    </div>
</div>

</body>
</html>
